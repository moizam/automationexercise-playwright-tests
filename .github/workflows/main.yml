name: Run Playwright Test and Deploy Allure Report

on:
  workflow_dispatch: 

jobs:
  run-playwright-tests:
    runs-on: ubuntu-latest

    env:
      GITHUB_ACTIONS: "true"

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-playwright pytest-order python-dotenv allure-pytest
          playwright install chromium --with-deps

      - name: Run Playwright Tests
        run: |
          pytest -s -v --alluredir=allure-results
        continue-on-error: true

      - name: Install Allure
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y npm
          sudo npm install -g allure-commandline --save-dev

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      # Deploying to the specific 'gh-pages' repository
      - name: Deploy to External Report Repo
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          # You must create a Personal Access Token (PAT) for cross-repo pushing
          personal_token: ${{ secrets.REPORT_REPO_TOKEN }}
          external_repository: moizam/gh-pages
          publish_branch: master # Based on your screenshot, your branch is 'master'
          publish_dir: allure-report
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
